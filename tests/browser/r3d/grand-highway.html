<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grand highway browser acceptance</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #090b10; color: #e6ebef; font: 14px system-ui, sans-serif; }
      body { padding: 16px; box-sizing: border-box; }
      #full-grand-canvas { display: block; width: 1280px; height: 800px; max-width: calc(100vw - 32px); margin: 0 auto 16px; }
      #preset-scene-host { position: relative; width: 1280px; height: 720px; max-width: calc(100vw - 32px); margin: 0 auto; overflow: hidden; }
      #preset-scene-host canvas { display: block; width: 100%; height: 100%; }
      #status { width: 1280px; max-width: calc(100vw - 32px); margin: 12px auto; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="full-grand-canvas" width="1280" height="800" aria-label="Full grand piano with curved note highway" data-testid="full-grand-canvas"></canvas>
    <div id="preset-scene-host" data-testid="grand-highway-scene"></div>
    <pre id="status">Starting real Three.js grand highway acceptance…</pre>
    <script type="module" src="./grand-highway.ts"></script>
  </body>
</html>
