name: Verify studio

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# A feature branch with an open PR needs one verification per latest commit,
# not duplicate Chrome/Edge matrices for every push and PR synchronization.
concurrency:
  group: verify-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Everything that does not need a browser runs once, on the cheapest runner,
  # instead of being repeated for every browser channel.
  static:
    name: Static checks
    # Windows keeps the pygame-based desktop geometry comparison available; the
    # rest of the checks do not depend on the OS.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pianomotion-studio
    steps:
      - uses: actions/checkout@v4
        with:
          path: pianomotion-studio
      - name: Frozen desktop geometry reference
        uses: actions/checkout@v4
        with:
          repository: V9011N/pygame-piano-animator
          ref: f8189c021d9235005fb35faa2c8cfbc09a3768a0
          path: pygame-piano-animator
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pianomotion-studio/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: npm ci
      - name: Install Python test dependencies
        run: python -m pip install -r python-core/requirements-test.txt
      - name: Python core and frozen goldens
        run: npm run test:python
      - name: Built-in catalog contracts
        run: npm run test:catalog
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest unit tests
        run: npm run test:unit
      - name: Native numerical parity
        run: npm run test:native-parity

  build:
    name: Production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The preview-based groups (PWA, media) serve this artifact from the site
      # root, so it must be built with the default base. The Pages build with
      # APP_BASE=/pianomotion-studio/ lives in deploy-pages.yml.
      - name: Build the site
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: apps/client/dist
          retention-days: 1

  # One job per group instead of a single sequential chain: a red UI test no
  # longer hides the worker, audio, SoundFont or GPU results, and the wall-clock
  # is the slowest group rather than the sum. The UI group is sharded.
  browser:
    name: ${{ matrix.channel }} · ${{ matrix.group }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Edge is ~20 minutes slower than Chrome and covers the same code, so it
        # runs on main and manual dispatches only.
        channel: ${{ github.event_name == 'pull_request' && fromJSON('["chrome"]') || fromJSON('["chrome","msedge"]') }}
        group: [ui-1, ui-2, ui-3, gpu, worker, audio, soundfont]
    env:
      PIANOMOTION_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Restore staged test assets
        id: assets
        uses: actions/cache@v4
        with:
          path: |
            apps/client/public/pyodide
            apps/client/public/python-core
            apps/client/public/m1-fixtures
            apps/client/public/builtin-melodies
            apps/client/public/soundfonts
          key: test-assets-${{ hashFiles('python-core/handthesia_core/*.py', 'python-core/handthesia_core/source_manifest.json', 'builtin_melodies/midi/**', 'assets/soundfonts/*.sf3', 'tools/pyodide-runtime-manifest.json') }}
      - name: Stage assets on a cache miss
        if: steps.assets.outputs.cache-hit != 'true'
        run: npm run prepare:m1:assets && npm run prepare:melodies && npm run prepare:soundfont
      - name: Install the selected browser
        run: npx playwright install ${{ matrix.channel }}
      - name: Run ${{ matrix.group }}
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$GROUP" in
            ui-*) npx playwright test --config playwright.config.ts --shard="${GROUP#ui-}/3" ;;
            gpu) npm run test:gpu ;;
            worker) npm run test:worker ;;
            audio) npm run test:audio ;;
            soundfont) npm run test:soundfont ;;
            *) echo "Unknown browser group: $GROUP" >&2; exit 1 ;;
          esac
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.channel }}-${{ matrix.group }}
          path: |
            test-results/
            !test-results/soundfont-inputs/**
            playwright-report/
          retention-days: 5

  # PWA/offline and media groups need the built site rather than the dev server.
  offline:
    name: ${{ matrix.channel }} · ${{ matrix.group }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: ${{ github.event_name == 'pull_request' && fromJSON('["chrome"]') || fromJSON('["chrome","msedge"]') }}
        group: [pwa, media]
    env:
      PIANOMOTION_BROWSER_CHANNEL: ${{ matrix.channel }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: apps/client/dist
      - name: Install the selected browser
        run: npx playwright install ${{ matrix.channel }}
      - name: Run ${{ matrix.group }}
        shell: bash
        env:
          GROUP: ${{ matrix.group }}
        run: |
          set -euo pipefail
          case "$GROUP" in
            pwa) npm run test:offline ;;
            media) npm run test:media ;;
            *) echo "Unknown offline group: $GROUP" >&2; exit 1 ;;
          esac
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.channel }}-${{ matrix.group }}
          path: |
            test-results/
            !test-results/soundfont-inputs/**
            playwright-report/
          retention-days: 5
