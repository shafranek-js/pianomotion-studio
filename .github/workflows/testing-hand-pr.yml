name: Testing Hand — targeted verification

on:
  pull_request:
    paths:
      - "apps/client/src/render3d/**"
      - "apps/client/src/settings/**"
      - "apps/client/src/i18n/**"
      - "apps/client/src/export/**"
      - "apps/client/src/render/pianoScene.ts"
      - ".github/workflows/testing-hand-pr.yml"
      - "tests/browser/anatomical-improved.spec.ts"
      - "tools/testing-hand-blender/**"
  workflow_dispatch:

permissions:
  contents: read

# Keep one latest review build. Browser asset staging is expensive; outdated
# test captures should never occupy runners after the experiment changes.
concurrency:
  group: testing-hand-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testing-hand:
    name: Testing hand / types, lint, focused unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint changed Testing paths
        # Full-repo lint currently fails on 3 preexisting no-explicit-any
        # diagnostics in tests/browser/anatomical-improved.spec.ts.
        run: >-
          npx eslint --config eslint.config.js
          apps/client/src/render3d/handRigBuilder.ts
          apps/client/src/render3d/testingHandSkin.ts
          apps/client/src/render3d/testingHandSkin.test.ts
          apps/client/src/render3d/testingHandRegistration.ts
          apps/client/src/render3d/testingHandRegistration.actual.test.ts
          apps/client/src/render3d/testingHandIntegration.actual.test.ts
          apps/client/src/render3d/testingHandDeformationQA.ts
          apps/client/src/render3d/testingHandWeightRegularizer.ts
          apps/client/src/render3d/testingHandBoneFrameTransfer.ts
          apps/client/src/render3d/testingHandBoneFrameTransfer.test.ts
          apps/client/src/render3d/testingHandPianistBenchmark.ts
          apps/client/src/render3d/testingHandPianistBenchmark.test.ts
          apps/client/src/render3d/testingHandSemanticWeights.ts
          apps/client/src/render3d/testingHandSemanticWeights.test.ts
          apps/client/src/render3d/testingHandDeformationHotspots.ts
          apps/client/src/render3d/testingHandPoseCorrectives.ts
          apps/client/src/render3d/testingHandPoseCorrectives.test.ts
          apps/client/src/render3d/testingHandMorphTargets.ts
          apps/client/src/render3d/testingHandMorphTargets.test.ts
          apps/client/src/render3d/improvedHandRuntime.ts
          apps/client/src/render3d/pianoScene3d.ts
          apps/client/src/render/pianoScene.ts
          apps/client/src/export/videoExportScene.ts
          apps/client/src/settings/types.ts
          apps/client/src/settings/SettingsModal.tsx
          apps/client/src/settings/handModel.test.ts
          apps/client/src/i18n
      - name: Focused unit tests
        run: npx vitest run apps/client/src/render3d/testingHandSkin.test.ts apps/client/src/render3d/testingHandIntegration.actual.test.ts apps/client/src/render3d/testingHandRegistration.actual.test.ts apps/client/src/render3d/testingHandBoneFrameTransfer.test.ts apps/client/src/render3d/testingHandPianistBenchmark.test.ts apps/client/src/render3d/testingHandSemanticWeights.test.ts apps/client/src/render3d/testingHandPoseCorrectives.test.ts apps/client/src/render3d/testingHandMorphTargets.test.ts apps/client/src/settings/handModel.test.ts

  blender-syntax:
    name: Testing hand / Blender authoring scripts compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Blender Python syntax without bpy
        run: python -m py_compile tools/testing-hand-blender/prepare_corrective_sculpt.py

  blender-actual-asset:
    name: Testing hand / run Blender on both real LOD0 hands
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends blender
          blender --version
      - name: Prepare left-hand corrective authoring in actual Blender
        run: >-
          blender -b -t 2 --python-exit-code 2
          --python tools/testing-hand-blender/prepare_corrective_sculpt.py --
          --side left --input apps/client/public/models/hands/improved/left-lod0.glb
          --output-blend scratch/blender-correctives/left-lod0.blend
          --report scratch/blender-correctives/left-lod0.json
      - name: Prepare right-hand corrective authoring in actual Blender
        run: >-
          blender -b -t 2 --python-exit-code 2
          --python tools/testing-hand-blender/prepare_corrective_sculpt.py --
          --side right --input apps/client/public/models/hands/improved/right-lod0.glb
          --output-blend scratch/blender-correctives/right-lod0.blend
          --report scratch/blender-correctives/right-lod0.json
      - name: Check real armature and sculpt masks for both hands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base = Path("scratch/blender-correctives")
          for hand in ("left", "right"):
              data = json.loads((base / f"{hand}-lod0.json").read_text("utf-8"))
              assert len(data["slots"]) == 48, (hand, len(data["slots"]))
              assert data["unsculpted"] == 48
              assert all(x["maskedVertices"] >= 10 for x in data["slots"])
              assert all(x["changedVertices"] == 0 for x in data["slots"])
              assert data["exportReady"] is False
              assert (base / f"{hand}-lod0.blend").stat().st_size > 10000
              print(hand, "48 Blender sculpt masks prepared; NO correctives sculpted or export-approved")
          PY
      - name: Preserve Blender source projects and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-hand-blender-authoring-${{ github.run_number }}
          path: scratch/blender-correctives/
          if-no-files-found: warn
          retention-days: 14

  browser-comparison:
    name: Testing hand / visual evidence — ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [webxr, anatomical, anatomical-improved, testing]
    env:
      PIANOMOTION_EVIDENCE_MODEL: ${{ matrix.model }}
      PIANOMOTION_BROWSER_CHANNEL: chromium
      PIANOMOTION_EVIDENCE_DIR: ${{ github.workspace }}/scratch/testing-hand-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Prepare local-only test resources
        run: node tools/ensure-test-assets.mjs
      - name: Capture matched WebGL models at common notes and views
        run: >-
          npx playwright test
          --config tests/browser/anatomical-improved.playwright.config.ts
          --grep 'Testing hand: matched WebGL model and camera evidence'
      - name: Save WebGL screenshots and diagnostic traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testing-hand-webgl-${{ matrix.model }}-${{ github.run_number }}
          path: |
            scratch/testing-hand-browser/playwright-results/
            scratch/testing-hand-browser/playwright-report.json
          if-no-files-found: warn
          retention-days: 14
