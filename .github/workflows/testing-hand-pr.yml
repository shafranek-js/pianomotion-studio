name: Testing Hand — targeted verification

on:
  pull_request:
    paths:
      - "apps/client/src/render3d/**"
      - "apps/client/src/settings/**"
      - "apps/client/src/i18n/**"
      - "apps/client/src/export/**"
      - "apps/client/src/render/pianoScene.ts"
      - ".github/workflows/testing-hand-pr.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testing-hand:
    name: Testing hand / types, lint, focused unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint changed Testing paths
        # Full-repo lint currently fails on 3 preexisting no-explicit-any
        # diagnostics in tests/browser/anatomical-improved.spec.ts.
        run: >-
          npx eslint --config eslint.config.js
          apps/client/src/render3d/handRigBuilder.ts
          apps/client/src/render3d/testingHandSkin.ts
          apps/client/src/render3d/testingHandSkin.test.ts
          apps/client/src/render3d/testingHandIntegration.actual.test.ts
          apps/client/src/render3d/improvedHandRuntime.ts
          apps/client/src/render3d/pianoScene3d.ts
          apps/client/src/render/pianoScene.ts
          apps/client/src/export/videoExportScene.ts
          apps/client/src/settings/types.ts
          apps/client/src/settings/SettingsModal.tsx
          apps/client/src/settings/handModel.test.ts
          apps/client/src/i18n
      - name: Focused unit tests
        run: npx vitest run apps/client/src/render3d/testingHandSkin.test.ts apps/client/src/render3d/testingHandIntegration.actual.test.ts apps/client/src/settings/handModel.test.ts
