name: Clean obsolete PR validation queue

on:
  push:
    branches:
      - feature/musical-loading-experience

permissions:
  contents: read
  actions: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel outdated browser checks without touching the latest commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          LATEST_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Keep validation for latest commit: ${LATEST_SHA}"
          gh api "repos/${REPO}/actions/runs?branch=feature%2Fmusical-loading-experience&per_page=100" \
            | jq -r --arg latest "${LATEST_SHA}" '
              .workflow_runs[]
              | select(.head_branch == "feature/musical-loading-experience")
              | select(.head_sha != $latest)
              | select(.name == "Verify studio" or .name == "Fast PR validation")
              | select(.status != "completed")
              | "\(.id) \(.head_sha) \(.name)"' \
            | while read -r run_id run_sha run_name; do
                echo "Cancel stale ${run_name} #${run_id} (${run_sha})"
                if gh api --method POST "repos/${REPO}/actions/runs/${run_id}/cancel" > /dev/null 2>&1; then
                  echo "Cancellation requested: ${run_id}"
                else
                  echo "Already completed, cancelling, or not cancellable: ${run_id}"
                fi
              done
          echo "Latest checks retained."
