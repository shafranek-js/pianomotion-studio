name: Deploy GitHub Pages

on:
  # Publish only after the verification workflow succeeds on main. A manual
  # dispatch stays available as an explicit override.
  workflow_run:
    workflows: ["Verify studio"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # A verification run already passed these; they are repeated only for a
      # manual dispatch, which can bypass the gate.
      - name: Check types (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run typecheck

      - name: Lint (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run lint

      - name: Run unit tests (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:unit

      - name: Build the project site
        env:
          APP_BASE: /pianomotion-studio/
        run: npm run build

      - name: Upload the production site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist
          retention-days: 1

      - name: Report deployment gate
        if: ${{ vars.PAGES_ENABLED != 'true' }}
        run: |
          echo "Pages deployment skipped: enable it with repository variable PAGES_ENABLED=true."

  deploy:
    if: ${{ needs.build.result == 'success' && vars.PAGES_ENABLED == 'true' && (github.event_name == 'workflow_run' || github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
