name: Deploy GitHub Pages

# GitHub Actions no longer verifies the project: `npm run ci:local` is the
# gate. This workflow only publishes a build that was already verified on the
# machine, and it is always started manually.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the project site
        env:
          APP_BASE: /pianomotion-studio/
        run: npm run build

      - name: Verify the exact production artifact
        run: npm run verify:release

      - name: Upload the production site
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/client/dist
          retention-days: 1

      - name: Report deployment gate
        if: ${{ vars.PAGES_ENABLED != 'true' }}
        run: |
          echo "Pages deployment skipped: enable it with repository variable PAGES_ENABLED=true."

  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
